services:
  crawl4ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crawl4ai-local
    env_file:
      - .env
    environment:
      - CRAWL4AI_DELAY_MIN_MS=3000      # 3 sec (was 9000)
      - CRAWL4AI_DELAY_MAX_MS=7000      # 7 sec (was 18000)
      - CRAWL4AI_MAX_CONCURRENCY=3      # 3 tabs (was 1) → 3x faster
      - CRAWL4AI_TIMEOUT=60000
      - CRAWL4AI_STEALTH=true
      - CRAWL4AI_HEADLESS=true
      - CRAWL4AI_WARMUP=true           # Pre-warm browser
      - CRAWL4AI_CACHE_ENABLED=true
      - CRAWL4AI_BLOCK_RESOURCES=image,media,font,stylesheet  # Block heavy assets
    ports:
      - "${CRAWL4AI_EXPOSE_PORT:-11235}:11235"
    volumes:
    - crawl4ai_cache:/root/.cache/crawl4ai
    restart: unless-stopped
    networks:
      - search-net

volumes:
  crawl4ai_cache:

networks:
  search-net:
    driver: bridge

